name: Reusable Next.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used when node-version-file is empty
        type: string
        required: false
        default: 22.13.0
      node-version-file:
        description: Optional repository-relative Node.js version file
        type: string
        required: false
        default: ""
      pnpm-version:
        description: pnpm version matching the root packageManager declaration
        type: string
        required: false
        default: 11.20.0
      working-directory:
        description: Repository-relative monorepo root
        type: string
        required: false
        default: .
      workspace-filters:
        description: Newline-separated pnpm workspace selectors
        type: string
        required: false
        default: ""
      frozen-lockfile:
        description: Install using the frozen lockfile policy
        type: boolean
        required: false
        default: true
      run-lint:
        description: Run the lint script
        type: boolean
        required: false
        default: true
      run-typecheck:
        description: Run the typecheck script
        type: boolean
        required: false
        default: true
      run-tests:
        description: Run the test script
        type: boolean
        required: false
        default: true
      run-build:
        description: Copy safe build configuration and run the build script
        type: boolean
        required: false
        default: true
      build-config-files:
        description: JSON object mapping build destinations to safe checked-in sources
        type: string
        required: false
        default: "{}"
      upload-build-artifacts:
        description: Upload caller-selected build diagnostics
        type: boolean
        required: false
        default: false
      build-artifact-paths:
        description: Newline-separated repository-relative artifact paths
        type: string
        required: false
        default: ""
      artifact-retention-days:
        description: Artifact retention from 1 through 90 days
        type: number
        required: false
        default: 14
    secrets:
      npm-token:
        description: Optional read-only npm-compatible registry token
        required: false
    outputs:
      lint-result:
        description: Lint result
        value: ${{ jobs.verify.outputs.lint-result }}
      typecheck-result:
        description: Type-check result
        value: ${{ jobs.verify.outputs.typecheck-result }}
      test-result:
        description: Test result
        value: ${{ jobs.verify.outputs.test-result }}
      build-result:
        description: Build result
        value: ${{ jobs.verify.outputs.build-result }}
      verification-passed:
        description: Whether every enabled check succeeded
        value: ${{ jobs.verify.outputs.verification-passed }}
      build-artifact:
        description: Diagnostic build artifact name, or empty
        value: ${{ jobs.verify.outputs.build-artifact }}

permissions:
  contents: read

jobs:
  verify:
    name: Install and verify monorepo
    runs-on: ubuntu-latest
    outputs:
      lint-result: ${{ steps.summary.outputs.lint-result }}
      typecheck-result: ${{ steps.summary.outputs.typecheck-result }}
      test-result: ${{ steps.summary.outputs.test-result }}
      build-result: ${{ steps.summary.outputs.build-result }}
      verification-passed: ${{ steps.summary.outputs.verification-passed }}
      build-artifact: ${{ steps.summary.outputs.build-artifact }}
    steps:
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve called workflow source
        id: toolkit
        shell: bash
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repository=$(jq -r '.workflow_repository // empty' <<< "$JOB_CONTEXT")
          sha=$(jq -r '.workflow_sha // empty' <<< "$JOB_CONTEXT")
          [[ "$repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out matching toolkit implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.toolkit.outputs.repository }}
          ref: ${{ steps.toolkit.outputs.sha }}
          path: .devops-toolkit-source
          persist-credentials: false

      - name: Validate workflow inputs
        id: validate
        env:
          NODE_VERSION: ${{ inputs.node-version }}
          NODE_VERSION_FILE: ${{ inputs.node-version-file }}
          PNPM_VERSION: ${{ inputs.pnpm-version }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          WORKSPACE_FILTERS: ${{ inputs.workspace-filters }}
          UPLOAD_BUILD_ARTIFACTS: ${{ inputs.upload-build-artifacts }}
          BUILD_ARTIFACT_PATHS: ${{ inputs.build-artifact-paths }}
          ARTIFACT_RETENTION_DAYS: ${{ inputs.artifact-retention-days }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs validate

      - name: Set up Node.js from version
        if: ${{ steps.validate.outputs.node-version-file == '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up Node.js from version file
        if: ${{ steps.validate.outputs.node-version-file != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ steps.validate.outputs.node-version-file }}

      - name: Activate the requested pnpm version
        env:
          PNPM_VERSION: ${{ inputs.pnpm-version }}
        run: |
          corepack enable
          corepack prepare "pnpm@$PNPM_VERSION" --activate

      - name: Resolve pnpm store
        id: store
        working-directory: ${{ steps.validate.outputs.working-directory }}
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore pnpm package store
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ inputs.pnpm-version }}-${{ hashFiles(steps.validate.outputs.lockfile) }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ inputs.pnpm-version }}-

      - name: Install dependencies
        working-directory: ${{ steps.validate.outputs.working-directory }}
        env:
          FROZEN_LOCKFILE: ${{ inputs.frozen-lockfile }}
          NODE_AUTH_TOKEN: ${{ secrets.npm-token }}
        run: |
          if [[ "$FROZEN_LOCKFILE" == "true" ]]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Validate scripts and workspace selection
        env:
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}/${{ steps.validate.outputs.working-directory }}
          WORKSPACE_FILTERS: ${{ inputs.workspace-filters }}
          RUN_LINT: ${{ inputs.run-lint }}
          RUN_TYPECHECK: ${{ inputs.run-typecheck }}
          RUN_TESTS: ${{ inputs.run-tests }}
          RUN_BUILD: ${{ inputs.run-build }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs preflight

      - name: Lint
        id: lint
        if: ${{ inputs.run-lint }}
        continue-on-error: true
        env:
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}/${{ steps.validate.outputs.working-directory }}
          WORKSPACE_FILTERS: ${{ inputs.workspace-filters }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs run lint

      - name: Type-check
        id: typecheck
        if: ${{ inputs.run-typecheck }}
        continue-on-error: true
        env:
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}/${{ steps.validate.outputs.working-directory }}
          WORKSPACE_FILTERS: ${{ inputs.workspace-filters }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs run typecheck

      - name: Test
        id: tests
        if: ${{ inputs.run-tests }}
        continue-on-error: true
        env:
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}/${{ steps.validate.outputs.working-directory }}
          WORKSPACE_FILTERS: ${{ inputs.workspace-filters }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs run test

      - name: Copy safe build configuration
        if: ${{ inputs.run-build && (!inputs.run-lint || steps.lint.outcome == 'success') && (!inputs.run-typecheck || steps.typecheck.outcome == 'success') && (!inputs.run-tests || steps.tests.outcome == 'success') }}
        env:
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}/${{ steps.validate.outputs.working-directory }}
          BUILD_CONFIG_FILES: ${{ inputs.build-config-files }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs copy-config

      - name: Build
        id: build
        if: ${{ inputs.run-build && (!inputs.run-lint || steps.lint.outcome == 'success') && (!inputs.run-typecheck || steps.typecheck.outcome == 'success') && (!inputs.run-tests || steps.tests.outcome == 'success') }}
        continue-on-error: true
        env:
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}/${{ steps.validate.outputs.working-directory }}
          WORKSPACE_FILTERS: ${{ inputs.workspace-filters }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs run build

      - name: Validate build artifact paths
        id: artifacts
        if: ${{ inputs.upload-build-artifacts && steps.build.outcome == 'success' }}
        env:
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}/${{ steps.validate.outputs.working-directory }}
          BUILD_ARTIFACT_PATHS: ${{ inputs.build-artifact-paths }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs artifacts

      - name: Upload build diagnostics
        id: upload
        if: ${{ inputs.upload-build-artifacts && steps.artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextjs-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.artifacts.outputs.artifact-paths }}
          if-no-files-found: error
          include-hidden-files: false
          retention-days: ${{ steps.validate.outputs.retention-days }}

      - name: Calculate workflow outputs
        id: summary
        if: ${{ always() }}
        env:
          RUN_LINT: ${{ inputs.run-lint }}
          RUN_TYPECHECK: ${{ inputs.run-typecheck }}
          RUN_TESTS: ${{ inputs.run-tests }}
          RUN_BUILD: ${{ inputs.run-build }}
          UPLOAD_BUILD_ARTIFACTS: ${{ inputs.upload-build-artifacts }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_NAME: nextjs-build-${{ github.run_id }}-${{ github.run_attempt }}
          WORKING_DIRECTORY_ABSOLUTE: ${{ github.workspace }}
        run: node .devops-toolkit-source/scripts/nextjs-ci.mjs summary

      - name: Enforce verification result
        if: ${{ steps.summary.outputs.verification-passed != 'true' }}
        run: exit 1
