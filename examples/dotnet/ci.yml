# Development smoke caller for the implemented reusable .NET CI, release configuration check, OCI publishing, and VPS deployment workflows.
# Replace the feature branch with a validated immutable release tag or full
# commit SHA before adoption. No v1 alias exists yet.
name: .NET CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "Directory.*.props"
      - "nuget.config"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "Directory.*.props"
      - "nuget.config"
      - ".github/workflows/ci.yml"

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
      packages: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/dotnet-ci.yml@feature/devops-003-dotnet-ci
    with:
      dotnet-version: 10.0.x
      solution-path: BackendProjectTemplate.slnx
      build-configuration: Release
      unit-test-projects: tests/unit/**/*.UnitTests.csproj
      integration-test-projects: tests/integration/**/*.IntegrationTests.csproj
      run-format: true
      collect-coverage: true
    secrets:
      nuget-username: ${{ secrets.GH_PKG_USERNAME }}
      nuget-token: ${{ secrets.GH_PKG_PAT }}

  # Runs on every event, without secrets: validates .github/docker-images.json,
  # .github/vps-deploy.production.json, and the rendered production Compose file
  # against the host policy, with the same code that publish and deploy run.
  check-release-config:
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/release-config-check.yml@feature/release-config-check
    with:
      image-config-path: .github/docker-images.json
      package-auth-components: |
        webapi
        consumer
        jobs
        migrator
      deploy-config-path: .github/vps-deploy.production.json
      environment: production
      stack-name: example-backend-production
      stack-registry-path: deploy/vps-deploy-stack.production.json
      # Placeholder group IDs standing in for the host's stack.env (see stack.env.example).
      compose-env-file: deploy/stack.env.example

  publish-images:
    needs: [verify, check-release-config]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/docker-publish.yml@feature/devops-005-docker-publish
    with:
      deployment-id: ${{ github.sha }}
      image-config-path: .github/docker-images.json
      package-auth-components: |
        webapi
        consumer
        jobs
        migrator
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
      github-packages-username: ${{ secrets.GH_PKG_USERNAME }}
      github-packages-token: ${{ secrets.GH_PKG_PAT }}

  # Deployment runs only after a successful trusted publish. The production
  # GitHub Environment holds the deploy-only SSH and pull-only registry
  # credentials and should require reviewers and restrict deployment refs.
  deploy-production:
    needs: publish-images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/vps-deploy.yml@feature/devops-010-migration-safe-deployment
    with:
      environment: production
      deployment-id: ${{ needs.publish-images.outputs.deployment-id }}
      manifest-json: ${{ needs.publish-images.outputs.manifest-json }}
      stack-name: example-backend-production
      # Compose files, path, migration, and health settings (see vps-deploy-config.json).
      deploy-config-path: .github/vps-deploy.production.json
    secrets:
      ssh-host: ${{ secrets.VPS_HOST }}
      ssh-user: ${{ secrets.VPS_DEPLOY_USER }}
      ssh-private-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
      ssh-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      registry-username: ${{ secrets.DOCKERHUB_READ_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_READ_TOKEN }}

  # Caller-owned alerting. The deployment workflow only records and exposes a
  # sanitized outcome; delivering an alert is this job's responsibility. The
  # webhook URL is a caller secret (Slack, Teams, an incident tool, or an email
  # relay) and never reaches the VPS. A red workflow run is not an alert.
  notify-deployment-failure:
    needs: deploy-production
    if: ${{ always() && (needs.deploy-production.result == 'failure' || needs.deploy-production.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send deployment failure alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
          STACK: example-backend-production
          OUTCOME: ${{ needs.deploy-production.outputs.deployment-outcome || 'unknown' }}
          FAILED_PHASE: ${{ needs.deploy-production.outputs.failed-phase || 'unknown' }}
          MIGRATION_STATUS: ${{ needs.deploy-production.outputs.migration-status || 'unknown' }}
          RESTORATION: ${{ needs.deploy-production.outputs.restoration-outcome || 'unknown' }}
          RECORD: ${{ needs.deploy-production.outputs.deployment-record-artifact }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$ALERT_WEBHOOK_URL" || { echo "DEPLOY_ALERT_WEBHOOK_URL is not configured; no alert was delivered" >&2; exit 1; }
          jq -n --arg stack "$STACK" --arg outcome "$OUTCOME" --arg phase "$FAILED_PHASE" --arg migration "$MIGRATION_STATUS" \
            --arg restoration "$RESTORATION" --arg record "$RECORD" --arg run "$RUN_URL" \
            '{text: "Production deployment of \($stack) \($outcome): phase=\($phase) migration=\($migration) restoration=\($restoration) record=\($record) \($run)"}' \
            | curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' --data @- "$ALERT_WEBHOOK_URL"
