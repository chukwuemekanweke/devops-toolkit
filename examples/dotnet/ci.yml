# Development smoke caller for the implemented reusable .NET CI workflow.
# Replace the feature branch with a validated immutable release tag or full
# commit SHA before adoption. No v1 alias exists yet.
name: .NET CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "Directory.*.props"
      - "nuget.config"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "*.slnx"
      - "Directory.*.props"
      - "nuget.config"
      - ".github/workflows/ci.yml"

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
      packages: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/dotnet-ci.yml@feature/devops-003-dotnet-ci
    with:
      dotnet-version: 10.0.x
      solution-path: BackendProjectTemplate.slnx
      build-configuration: Release
      unit-test-projects: tests/unit/**/*.UnitTests.csproj
      integration-test-projects: tests/integration/**/*.IntegrationTests.csproj
      run-format: true
      collect-coverage: true
    secrets:
      nuget-username: ${{ secrets.GH_PKG_USERNAME }}
      nuget-token: ${{ secrets.GH_PKG_PAT }}
