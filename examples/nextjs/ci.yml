# The verification job is runnable while developing DEVOPS-004. Replace the
# feature branch with a validated immutable release tag or full commit SHA for
# production adoption. The publishing workflow remains planned and is omitted.
name: Next.js CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".github/workflows/frontend-ci.yml"

permissions: {}

jobs:
  verify-monorepo:
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/nextjs-ci.yml@feature/devops-004-nextjs-ci
    with:
      node-version-file: .node-version
      pnpm-version: 11.20.0
      build-config-files: >-
        {
          "apps/user-portal/.env.local":"apps/user-portal/.env.example",
          "apps/admin-portal/.env.local":"apps/admin-portal/.env.example",
          "apps/public-portal/.env.local":"apps/public-portal/.env.example"
        }
    # For private dependencies only, map a read-only token explicitly:
    # secrets:
    #   npm-token: ${{ secrets.NPM_READ_TOKEN }}

  # A caller may use this job instead of verify-monorepo, or place selectors in
  # a caller-owned matrix. The selector is illustrative and not toolkit-owned.
  # verify-user-portal:
  #   permissions:
  #     contents: read
  #   uses: chukwuemekanweke/devops-toolkit/.github/workflows/nextjs-ci.yml@feature/devops-004-nextjs-ci
  #   with:
  #     node-version-file: .node-version
  #     pnpm-version: 11.20.0
  #     workspace-filters: '@template/user-portal...'
  #     build-config-files: >-
  #       {"apps/user-portal/.env.local":"apps/user-portal/.env.example"}
