# Development smoke caller for reusable Next.js CI and OCI publishing. Replace
# feature branches with validated immutable release tags or full commit SHAs.
name: Next.js CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".github/workflows/frontend-ci.yml"

permissions: {}

jobs:
  verify-monorepo:
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/nextjs-ci.yml@feature/devops-004-nextjs-ci
    with:
      node-version-file: .node-version
      pnpm-version: 11.20.0
      build-config-files: >-
        {
          "apps/user-portal/.env.local":"apps/user-portal/.env.example",
          "apps/admin-portal/.env.local":"apps/admin-portal/.env.example",
          "apps/public-portal/.env.local":"apps/public-portal/.env.example"
        }
    # For private dependencies only, map a read-only token explicitly:
    # secrets:
    #   npm-token: ${{ secrets.NPM_READ_TOKEN }}

  # A caller may use this job instead of verify-monorepo, or place selectors in
  # a caller-owned matrix. The selector is illustrative and not toolkit-owned.
  # verify-user-portal:
  #   permissions:
  #     contents: read
  #   uses: chukwuemekanweke/devops-toolkit/.github/workflows/nextjs-ci.yml@feature/devops-004-nextjs-ci
  #   with:
  #     node-version-file: .node-version
  #     pnpm-version: 11.20.0
  #     workspace-filters: '@template/user-portal...'
  #     build-config-files: >-
  #       {"apps/user-portal/.env.local":"apps/user-portal/.env.example"}

  publish-images:
    needs: verify-monorepo
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/docker-publish.yml@feature/devops-005-docker-publish
    with:
      deployment-id: ${{ github.sha }}
      image-config-path: .github/docker-images.json
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}
