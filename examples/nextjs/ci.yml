# Development smoke caller for reusable Next.js CI, OCI publishing, and VPS deployment. Replace
# feature branches with validated immutable release tags or full commit SHAs.
name: Next.js CI

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".node-version"
      - ".github/workflows/frontend-ci.yml"

permissions: {}

jobs:
  verify-monorepo:
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/nextjs-ci.yml@feature/devops-004-nextjs-ci
    with:
      node-version-file: .node-version
      pnpm-version: 11.20.0
      build-config-files: >-
        {
          "apps/user-portal/.env.local":"apps/user-portal/.env.example",
          "apps/admin-portal/.env.local":"apps/admin-portal/.env.example",
          "apps/public-portal/.env.local":"apps/public-portal/.env.example"
        }
    # For private dependencies only, map a read-only token explicitly:
    # secrets:
    #   npm-token: ${{ secrets.NPM_READ_TOKEN }}

  # A caller may use this job instead of verify-monorepo, or place selectors in
  # a caller-owned matrix. The selector is illustrative and not toolkit-owned.
  # verify-user-portal:
  #   permissions:
  #     contents: read
  #   uses: chukwuemekanweke/devops-toolkit/.github/workflows/nextjs-ci.yml@feature/devops-004-nextjs-ci
  #   with:
  #     node-version-file: .node-version
  #     pnpm-version: 11.20.0
  #     workspace-filters: '@template/user-portal...'
  #     build-config-files: >-
  #       {"apps/user-portal/.env.local":"apps/user-portal/.env.example"}

  publish-images:
    needs: verify-monorepo
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/docker-publish.yml@feature/devops-005-docker-publish
    with:
      deployment-id: ${{ github.sha }}
      image-config-path: .github/docker-images.json
    secrets:
      registry-username: ${{ secrets.DOCKERHUB_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Deploys the three portals as one independent stack. No migration stage:
  # migration-service is left at its empty default. The manifest is taken from
  # the publish run's artifact to demonstrate the artifact transport.
  deploy-production:
    needs: publish-images
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
    uses: chukwuemekanweke/devops-toolkit/.github/workflows/vps-deploy.yml@feature/devops-010-migration-safe-deployment
    with:
      environment: production
      deployment-id: ${{ needs.publish-images.outputs.deployment-id }}
      manifest-artifact: ${{ needs.publish-images.outputs.manifest-artifact }}
      compose-files: deploy/compose.production.yml
      stack-name: example-frontend-production
      remote-deployment-path: /srv/example-frontend/production
      health-checks: >-
        [
          {"name":"user-portal","url":"http://127.0.0.1:3001/"},
          {"name":"admin-portal","url":"http://127.0.0.1:3002/","expectedStatus":[200,307]},
          {"name":"public-portal","url":"http://127.0.0.1:3003/"}
        ]
    secrets:
      ssh-host: ${{ secrets.VPS_HOST }}
      ssh-user: ${{ secrets.VPS_DEPLOY_USER }}
      ssh-private-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
      ssh-known-hosts: ${{ secrets.VPS_KNOWN_HOSTS }}
      registry-username: ${{ secrets.DOCKERHUB_READ_USERNAME }}
      registry-token: ${{ secrets.DOCKERHUB_READ_TOKEN }}

  # Caller-owned alerting. The deployment workflow only records and exposes a
  # sanitized outcome; delivering an alert is this job's responsibility. The
  # webhook URL is a caller secret (Slack, Teams, an incident tool, or an email
  # relay) and never reaches the VPS. A red workflow run is not an alert.
  notify-deployment-failure:
    needs: deploy-production
    if: ${{ always() && (needs.deploy-production.result == 'failure' || needs.deploy-production.result == 'cancelled') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send deployment failure alert
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
          STACK: example-frontend-production
          OUTCOME: ${{ needs.deploy-production.outputs.deployment-outcome || 'unknown' }}
          FAILED_PHASE: ${{ needs.deploy-production.outputs.failed-phase || 'unknown' }}
          MIGRATION_STATUS: ${{ needs.deploy-production.outputs.migration-status || 'unknown' }}
          RESTORATION: ${{ needs.deploy-production.outputs.restoration-outcome || 'unknown' }}
          RECORD: ${{ needs.deploy-production.outputs.deployment-record-artifact }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -n "$ALERT_WEBHOOK_URL" || { echo "DEPLOY_ALERT_WEBHOOK_URL is not configured; no alert was delivered" >&2; exit 1; }
          jq -n --arg stack "$STACK" --arg outcome "$OUTCOME" --arg phase "$FAILED_PHASE" --arg migration "$MIGRATION_STATUS" \
            --arg restoration "$RESTORATION" --arg record "$RECORD" --arg run "$RUN_URL" \
            '{text: "Production deployment of \($stack) \($outcome): phase=\($phase) migration=\($migration) restoration=\($restoration) record=\($record) \($run)"}' \
            | curl --fail --silent --show-error --max-time 30 -H 'Content-Type: application/json' --data @- "$ALERT_WEBHOOK_URL"
